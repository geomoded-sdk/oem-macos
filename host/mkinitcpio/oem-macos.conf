# /etc/mkinitcpio.conf for OEM-macOS.
#
# MODULES: the storage controller and filesystem the root is on. Everything else is loaded on
# demand by udev, which keeps the initramfs small.
# HOOKS: systemd rather than the busybox hooks, because the host is systemd already and one
# init implementation is one fewer thing to get wrong. `kms` is included so the display's
# driver is loaded before the guest starts, not after.
MODULES=(ext4)
BINARIES=()
FILES=()
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 --long=27)
