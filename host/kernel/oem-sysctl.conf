# Kernel tuning for an OEM-macOS host.
#
# Each value is here because a specific mechanism needs it. A value whose reason cannot be
# named is not in this file.

# reims-vgpu maps guest memory through the kernel; each view is a mapping. Upstream's docs
# recommend 8388608 for a 16 GiB guest, and the default 65530 fails well below that.
vm.max_map_count = 8388608

# The guest's RAM is one large shared memfd, allocated whole at start. Swapping it would stall
# the guest's GPU work behind disk I/O, which is worse than the memory pressure it relieves.
vm.swappiness = 10

# The guest is interactive: a desktop's input and display latency matter more than throughput
# for its QEMU thread.
kernel.sched_autogroup_enabled = 0

# QEMU's guest memory and the GPU's buffers are large; a low dirty ratio keeps a write burst
# from stalling the guest for seconds.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# inotify watches are cheap and some macOS software in the guest polls host-shared paths.
fs.inotify.max_user_watches = 524288
