# Modules the guest needs before it starts. systemd-modules-load runs before oem-core.service.
#
# kvm_intel / kvm_amd: whichever matches the CPU; a module that does not apply fails harmlessly.
# udmabuf: reims-vgpu hands guest memory to the GPU through it. Without it the guest can crash
# above a low resolution (upstream docs/architecture.md).
kvm
udmabuf
