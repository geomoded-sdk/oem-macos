title    OEM-macOS installer
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# `quiet` and `loglevel=0` keep the kernel from printing over the black screen the autostart
# draws; `console=tty1` puts anything that does escape on the tty the installer owns.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=0 vt.global_cursor_default=0 console=tty1 %KERNEL_PARAMS%
