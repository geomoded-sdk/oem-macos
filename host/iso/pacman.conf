#
# The installer medium's pacman configuration.
#
# Copied from archiso's releng profile: the four official repositories, signed, with the
# mirrorlist the build environment provides. `multilib` is not enabled because nothing on the
# medium is 32-bit and enabling it would let a stray dependency be resolved into a package the
# host manifest does not name.
#
[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
